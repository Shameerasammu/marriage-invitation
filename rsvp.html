    href="stylesz.css">


<!-- GLASS RSVP -->

<div id="rsvp" class="glass-card rsvp-card">

    <h2 class="section-title">RSVP</h2>

    <p class="rsvp-text">
        Kindly confirm your gracious presence.
    </p>

    <form class="rsvp-form">

        <input
            id="name"
            type="text"
            placeholder="Your Name"
            required>

        <input
            id="phone"
            type="tel"
            placeholder="Phone Number"
            required>

        <textarea
            id="message"
            placeholder="Leave your dua or message"></textarea>

        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="attend"
                    value="Will Attend"
                    required>

                Will Attend
            </label>

            <label>
                <input
                    type="radio"
                    name="attend"
                    value="Unable To Attend">

                Unable To Attend
            </label>

        </div>

        <button type="submit">
            Send Response
        </button>

    </form>

</div>
<script src="Script.js"></script>
